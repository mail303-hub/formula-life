<title>Formula Life</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: a pit-wall dashboard. Driver card and championship table on the left, the current race weekend step on the right; stacks with the weekend first on phones. */
:root {
  --bg: #f0f1ec;
  --card: #fafaf7;
  --ink: #17211f;
  --mute: #5b6a66;
  --line: #d8dcd5;
  --accent: #c2460f;
  --accent-ink: #ffffff;
  --good: #0d6b62;
  --bad: #b3261e;
  --hi: #fbe6d8;
  --track: #e3e6df;
  --font-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1514; --card: #172120; --ink: #e8eeeb; --mute: #95a5a0; --line: #2a3835;
    --accent: #ff8a4c; --accent-ink: #1a0d05; --good: #4cc2b4; --bad: #ff7a70; --hi: #3a2a22; --track: #243230;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1514; --card: #172120; --ink: #e8eeeb; --mute: #95a5a0; --line: #2a3835;
  --accent: #ff8a4c; --accent-ink: #1a0d05; --good: #4cc2b4; --bad: #ff7a70; --hi: #3a2a22; --track: #243230;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 1040px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; text-wrap: balance; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.05rem; }
p { margin: 0 0 .6em; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.mute { color: var(--mute); }
.label { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); font-weight: 600; }

header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; padding-bottom: 16px; border-bottom: 2px solid var(--ink); margin-bottom: 20px; }
.brand { font-family: var(--font-display); font-size: 2rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; line-height: 1; }
.brand span { color: var(--accent); }
.hstate { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { font-family: var(--font-data); font-size: .8rem; border: 1px solid var(--line); background: var(--card); padding: 4px 10px; border-radius: 4px; }
.chip.tier { background: var(--ink); color: var(--bg); border-color: var(--ink); }

button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; padding: 12px 22px; border-radius: 4px; font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 6px 12px; font-size: .9rem; letter-spacing: .04em; }
.btn.ghost.warn { border-color: var(--bad); color: var(--bad); }
.btn.secondary { background: transparent; color: var(--ink); border: 2px solid var(--ink); }

.grid { display: grid; grid-template-columns: 330px minmax(0, 1fr); grid-template-areas: "side main"; gap: 20px; align-items: start; }
.side { grid-area: side; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.main { grid-area: main; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
@media (max-width: 760px) {
  .grid { grid-template-columns: minmax(0, 1fr); grid-template-areas: "main" "side"; }
}
.card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-width: 0; }
.card > .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }

.stat { display: grid; grid-template-columns: 112px 1fr 32px; gap: 10px; align-items: center; padding: 5px 0; font-size: .95rem; }
.bar { height: 8px; background: var(--track); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ink); }
.bar.energy > i { background: var(--good); }
.bar.energy.low > i { background: var(--bad); }
.stat b { text-align: right; font-weight: 500; }
.sep { border-top: 1px solid var(--line); margin: 10px 0; }
.kv { display: flex; justify-content: space-between; padding: 3px 0; }

.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; margin: 8px 0 16px; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.opt label { display: block; height: 100%; border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; background: var(--bg); }
.opt button.offer { display: block; width: 100%; height: 100%; text-align: left; border: 1px solid var(--line); border-radius: 4px; padding: 12px; background: var(--bg); color: var(--ink); }
.opt button.offer:hover:not(:disabled) { border-color: var(--accent); background: var(--hi); }
.opt button.offer:disabled { opacity: .5; cursor: not-allowed; }
.opt button.offer .t { font-size: 1.15rem; margin: 2px 0 6px; }
.opt input:checked + label { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--hi); }
.opt input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt input:disabled + label { opacity: .45; }
.opt .t { font-weight: 600; display: block; }
.opt .d { font-size: .85rem; color: var(--mute); display: block; }

.weekend { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; margin-bottom: 14px; }
.weekend h2 { font-size: 1.8rem; }

table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th { text-align: left; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--line); }
td { padding: 6px; border-bottom: 1px solid var(--line); }
tr.me td { background: var(--hi); font-weight: 600; }
td.num, th.num { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
td.dnf { color: var(--bad); }
.scroll { overflow-x: auto; }
.team { color: var(--mute); font-size: .82rem; }

.notes { margin: 0 0 14px; padding: 0; list-style: none; display: grid; gap: 6px; }
.notes li { padding-left: 12px; border-left: 3px solid var(--line); }
.notes li.good { border-color: var(--good); }
.notes li.bad { border-color: var(--bad); }
.big { font-family: var(--font-display); font-size: 3.4rem; line-height: 1; font-weight: 700; }
.row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.start { max-width: 560px; }
.start input { font: inherit; padding: 10px 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 4px; width: 100%; max-width: 320px; }
.pos-gain { color: var(--good); }
.banner { background: var(--ink); color: var(--bg); padding: 16px; border-radius: 6px; margin-bottom: 14px; }
.banner h2 { font-size: 1.8rem; }
.hud { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0 0 10px; font-size: 1rem; }
.hud .bad { color: var(--bad); }
.canvaswrap { position: relative; }
canvas { display: block; width: 100%; height: auto; aspect-ratio: 900 / 560; border: 1px solid var(--line); border-radius: 4px; background: var(--track); touch-action: none; }
.driveover { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: color-mix(in srgb, var(--bg) 82%, transparent); border-radius: 4px; }
.driveover[hidden] { display: none; }
.touch { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
.touch button { padding: 16px 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 4px; font-weight: 600; touch-action: none; user-select: none; -webkit-user-select: none; }
.touch button:active { background: var(--hi); border-color: var(--accent); }
.stage { --reserve: 70px; }
.stage.fs { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  padding: max(10px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.stage.fs .hud { width: 100%; margin: 0; align-items: center; }
.stage.fs .canvaswrap { width: min(100%, calc((100vh - var(--reserve)) * 1.6071)); width: min(100%, calc((100dvh - var(--reserve)) * 1.6071)); }
.stage.fs .touch { width: 100%; margin: 0; }
.stage.fs .touch button { padding: 12px 6px; }
@media (pointer: fine) { .stage.fs .touch { display: none; } .stage.fs { --reserve: 56px; } }
@media (pointer: coarse) { .stage.fs { --reserve: 130px; } }
.padov { position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
.padbox { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 16px; width: min(560px, 100%); max-height: 100%; overflow: auto; }
.padrow { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.padmsg { margin: 12px 0 8px; min-height: 1.4em; font-weight: 600; color: var(--accent); }
.padraw { font-size: .8rem; line-height: 1.6; word-break: break-word; }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .35s ease; } }
</style>

<div class="wrap">
  <header>
    <div class="brand">Formula <span>Life</span></div>
    <div class="hstate" id="hstate"></div>
  </header>
  <div id="app"></div>
</div>

<script>
(function () {
  var KEY = 'formula-life-v3';
  var TEAMS2 = ['Redstone Works','Blue Heron Racing','Atlas Garage','Pinecrest Motorsport','Nova Speed','Harrow & Sons','Quillon GP','Foxglove Racing'];

  var TIERS = [
    { name: 'Junior Karting', base: 39, races: 5,  mult: 1, next: 'Senior Karting', kart: true,  kmh: 0.45 },
    { name: 'Senior Karting', base: 47, races: 6,  mult: 2, next: 'Formula 4',      kart: true,  kmh: 0.6 },
    { name: 'Formula 4',      base: 54, races: 7,  mult: 3, next: 'Formula 3',      kart: false, kmh: 0.9 },
    { name: 'Formula 3',      base: 62, races: 8,  mult: 4, next: 'Formula 2',      kart: false, kmh: 1.1 },
    { name: 'Formula 2',      base: 71, races: 9,  mult: 6, next: 'Formula 1',      kart: false, kmh: 1.3 },
    { name: 'Formula 1',      base: 80, races: 10, mult: 9, next: null,             kart: false, kmh: 1.4 }
  ];
  var TRACKS = [
    { name: 'Verdane Ring', wet: 20 }, { name: 'Port Castel', wet: 15 }, { name: 'Alpenmoor', wet: 45 },
    { name: 'Saltmarsh Circuit', wet: 35 }, { name: 'Kinsey Park', wet: 30 }, { name: 'Nordhaven', wet: 55 },
    { name: 'Rio Estrela', wet: 25 }, { name: 'Coldwater Bend', wet: 50 }, { name: 'Sakura Hills', wet: 40 }, { name: 'Dunmore', wet: 60 }
  ];
  var FIRST = ['Luca','Marek','Niko','Teo','Anselm','Rafa','Kasper','Joon','Elias','Dario','Viktor','Mateo','Sami','Oskar','Felix','Ivo'];
  var LAST = ['Verhoeven','Castellane','Okafor','Lindqvist','Marchetti','Duval','Novak','Ishikawa','Brandt','Moreau','Halvorsen','Pereira','Kovac','Salazar','Wren','Ashby'];
  var TEAMS = ['Vanta Racing','Brightline','Kestrel GP','Orrin Motorsport','Lumen Racing','Halcyon','Ridgeback','Tidewater','Ironvale','Corvane'];
  var POINTS = [25, 18, 15, 12, 10, 8, 6, 4, 2, 1];
  var PRIZE = [100, 70, 50, 35, 25, 15, 10, 5, 0, 0];
  var STRATS = {
    push:     { label: 'Push',     desc: 'Faster on average, big swings, highest crash risk.', mean: 4,  sd: 9,   crash: 0.12 },
    balanced: { label: 'Balanced', desc: 'Steady pace and normal risk.',                       mean: 0,  sd: 6,   crash: 0.05 },
    safe:     { label: 'Careful',  desc: 'Slower, but rarely makes mistakes.',                 mean: -3, sd: 3.5, crash: 0.015 }
  };
  var DIFF = {
    easy:   { label: 'Easy',   r: -4, f: 0.76, desc: 'Slower rivals' },
    medium: { label: 'Medium', r: 0,  f: 0.82, desc: 'Balanced rivals' },
    hard:   { label: 'Hard',   r: 3,  f: 0.87, desc: 'Fast, tough rivals' }
  };
  var STATS = [['pace', 'Pace'], ['cons', 'Consistency'], ['wet', 'Wet driving'], ['tyre', 'Tyre care']];

  var s = null;                 // game state (saved)
  var ui = { action: 'pace', strat: 'balanced', mode: 'drive', diff: 'medium', confirmReset: false, name: '' };

  /* ---------- helpers ---------- */
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function gauss() { var u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function esc(t) { return String(t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { return (n < 0 ? '-' : '') + '$' + Math.abs(Math.round(n)).toLocaleString('en-US'); }
  function ord(n) { var k = n % 100; if (k >= 11 && k <= 13) return n + 'th'; return n + (['th', 'st', 'nd', 'rd'][n % 10] || 'th'); }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
  function load() { try { var r = localStorage.getItem(KEY); if (r) { var o = JSON.parse(r); if (o && o.phase) return o; } } catch (e) {} return null; }
  /* ---------- gamepad mapping (saved in the browser) ---------- */
  var PAD_KEY = 'formula-life-pad';
  function loadPad() { try { var r = localStorage.getItem(PAD_KEY); if (r) { var o = JSON.parse(r); if (o && typeof o === 'object') return o; } } catch (e) {} return {}; }
  function savePad() { try { localStorage.setItem(PAD_KEY, JSON.stringify(PadMap)); } catch (e) {} }
  var PadMap = loadPad();
  function mapVal(pad, m) {
    if (m.t === 'b') { var q = pad.buttons[m.i]; return q ? (q.value || (q.pressed ? 1 : 0)) : 0; }
    var v = pad.axes[m.i]; return v === undefined ? 0 : (v - m.rest) * m.dir / m.span;
  }
  function padValues(pad) {   // steer -1..1, gas 0..1, brake 0..1 (custom mapping first, then the standard layout)
    var bt = function (n) { var q = pad.buttons[n]; return q ? (q.value || (q.pressed ? 1 : 0)) : 0; };
    var st = PadMap.steer ? clamp(mapVal(pad, PadMap.steer), -1, 1) : (pad.axes[0] || 0);
    if (Math.abs(st) < 0.1) st = 0; else st = clamp((st - Math.sign(st) * 0.1) / 0.9, -1, 1);
    return { steer: st, gas: PadMap.gas ? clamp(mapVal(pad, PadMap.gas), 0, 1) : Math.max(bt(7), bt(0)), brake: PadMap.brake ? clamp(mapVal(pad, PadMap.brake), 0, 1) : Math.max(bt(6), bt(1)), bt: bt };
  }

  function tier() { return TIERS[s.tier]; }
  function diff() { return DIFF[s && s.diff] || DIFF.medium; }
  function trainCost() { return 30 * tier().mult; }

  /* ---------- game setup ---------- */
  function newCareer(name) {
    s = {
      name: name || 'You', diff: ui.diff || 'medium', tier: 0, season: 1, money: 300, rep: 10, energy: 100,
      stats: { pace: 45, cons: 45, wet: 40, tyre: 40 }, phase: 'prep'
    };
    startSeason(false);
  }

  function startSeason(develop) {
    var t = tier();
    if (develop) {
      STATS.forEach(function (k) { s.stats[k[0]] = clamp(s.stats[k[0]] + 2, 0, 100); });
    }
    s.energy = 100;
    var names = shuffle(FIRST.map(function (f, i) { return f + ' ' + LAST[(i * 5 + s.tier * 3 + s.season) % LAST.length]; }));
    var teams = shuffle(TEAMS);
    s.drivers = [{ id: 'me', name: s.name, team: 'Your team', me: true, pts: 0, wins: 0, rating: 0, wetSkill: 0 }];
    for (var i = 0; i < 9; i++) {
      s.drivers.push({ id: 'r' + i, name: names[i], team: teams[i], me: false, pts: 0, wins: 0,
        rating: clamp(t.base + gauss() * 5, 25, 96), wetSkill: gauss() * 6 });
    }
    s.calendar = shuffle(TRACKS).slice(0, t.races);
    s.race = 0;
    s.last = null;
    s.result = null;
    s.team = null;
    s.offers = makeOffers();
    s.phase = 'offers';
  }

  function makeOffers() {
    var t = tier(), n = shuffle(TEAMS2);
    return [
      { name: n[0], kind: 'Budget team', car: 42 + rnd(0, 4), bonus: 40 * t.mult, req: 0 },
      { name: n[1], kind: 'Midfield team', car: 52 + rnd(0, 4), bonus: 0, req: 8 + 5 * s.tier },
      { name: n[2], kind: 'Top team', car: 66 + rnd(0, 4), bonus: 0, req: 25 + 9 * s.tier }
    ];
  }

  function setupWeekend() {
    var tr = s.calendar[s.race];
    s.rain = clamp(Math.round(tr.wet + (Math.random() - 0.5) * 20), 0, 95);
    s.phase = 'prep';
    ui.action = 'pace';
  }

  /* ---------- race simulation ---------- */
  function playerBase(wet) {
    var t = s.stats;
    var core = t.pace * 0.45 + t.cons * 0.25 + (wet ? t.wet : t.tyre) * 0.30;
    return core * (0.85 + 0.15 * s.energy / 100) + (s.team.car - 50) * 0.45;
  }

  function runWeekend(action, stratKey, driven) {
    var t = tier(), tr = s.calendar[s.race], st = STRATS[stratKey] || STRATS.balanced, notes = [];
    var spent = 0, earned = 0, wet;

    if (driven) {
      notes = s.pending.notes; spent = s.pending.spent; earned = s.pending.earned; wet = s.pending.wet; s.pending = null;
    } else {
    // 1. weekend activity
    if (action === 'rest') {
      s.energy = clamp(s.energy + 30, 0, 100);
      notes.push({ t: 'You rested and arrived at the track fresh.' });
    } else if (action === 'sponsor') {
      s.money += 60 * t.mult; s.rep = clamp(s.rep + 2, 0, 100); s.energy = clamp(s.energy - 10, 0, 100);
      earned += 60 * t.mult;
      notes.push({ t: 'Sponsor event: +' + money(60 * t.mult) + ' and a little more reputation.', c: 'good' });
    } else {
      var gain = rnd(2, 4), c = trainCost(), label = '';
      STATS.forEach(function (k) { if (k[0] === action) label = k[1]; });
      s.stats[action] = clamp(s.stats[action] + gain, 0, 100);
      s.money -= c; spent += c; s.energy = clamp(s.energy - 15, 0, 100);
      notes.push({ t: 'Training: ' + label + ' +' + gain + ' (cost ' + money(c) + ').', c: 'good' });
    }

    // 2. race
    wet = Math.random() * 100 < s.rain;
    var entry = 20 * t.mult;
    s.money -= entry; spent += entry;
    if (ui.mode === 'drive') {
      s.pending = { notes: notes, spent: spent, earned: earned, wet: wet };
      s.phase = 'drive';
      save();
      return;
    }
    }
    var results = s.drivers.map(function (d) {
      var perf, dnf = false;
      if (driven && driven.order) {
        perf = -driven.order.indexOf(d.id);
      } else if (d.me) {
        perf = playerBase(wet) + st.mean + gauss() * st.sd;
        var cp = st.crash * (1.5 - s.stats.cons / 100) + (wet ? 0.03 : 0);
        dnf = Math.random() < cp;
      } else {
        perf = d.rating + diff().r + (wet ? d.wetSkill : 0) + gauss() * 6;
        dnf = Math.random() < (wet ? 0.06 : 0.03);
      }
      return { d: d, perf: perf, dnf: dnf };
    });
    var fin = results.filter(function (r) { return !r.dnf; }).sort(function (a, b) { return b.perf - a.perf; });
    var out = shuffle(results.filter(function (r) { return r.dnf; }));
    var order = fin.concat(out).map(function (r, i) {
      var pts = r.dnf ? 0 : (POINTS[i] || 0);
      r.d.pts += pts;
      if (i === 0 && !r.dnf) r.d.wins += 1;
      return { name: r.d.name, team: r.d.team, me: r.d.me, pos: i + 1, pts: pts, dnf: r.dnf };
    });
    var mine = order.filter(function (o) { return o.me; })[0];

    // 3. money, reputation, notes
    var prize = mine.dnf ? 0 : PRIZE[mine.pos - 1] * t.mult;
    s.money += prize; earned += prize;
    var repD = mine.dnf ? -2 : mine.pos <= 3 ? 3 : mine.pos <= 6 ? 1 : 0;
    s.rep = clamp(s.rep + repD, 0, 100);
    s.energy = clamp(s.energy - 15, 0, 100);

    if (driven && driven.order) notes.push({ t: 'You drove this race yourself.' });
    notes.unshift({ t: wet ? 'Rain at ' + tr.name + '. The track was wet for the whole race.' : tr.name + ' stayed dry.' });
    if (mine.dnf) {

    h += opt('action', 'sponsor', ui.action === 'sponsor', 'Sponsor event', 'Earn ' + money(60 * t.mult) + ' and reputation, uses 10 energy', false);
    h += '</div><div class="label">2. How to race</div><div class="opts">';
    h += opt('mode', 'drive', ui.mode === 'drive', 'Drive it yourself', 'Three laps on a track. Keyboard or touch buttons. Your skills set the car\'s limits', false);
    h += opt('mode', 'sim', ui.mode === 'sim', 'Simulate', 'The game plays the race out for you', false);
    h += '</div>';
    if (ui.mode === 'sim') {
      h += '<div class="label">3. Race approach</div><div class="opts">';
      Object.keys(STRATS).forEach(function (k) { h += opt('strat', k, ui.strat === k, STRATS[k].label, STRATS[k].desc, false); });
      h += '</div>';
    }
    h += '<button class="btn" data-go="race">' + (ui.mode === 'drive' ? 'Go to the grid' : 'Go racing') + '</button></div>';
    return h;
  }

  function resultView() {
    var L = s.last, h = '<div class="card"><div class="weekend"><h2>' + esc(L.track) + '</h2><span class="chip">' + (L.wet ? 'Wet' : 'Dry') + '</span></div>';
    h += '<div class="row" style="justify-content:flex-start;gap:24px;margin-bottom:12px"><div><div class="label">Your result</div><div class="big">' + (L.mine.dnf ? 'DNF' : ord(L.mine.pos)) + '</div></div><div><div class="label">Points</div><div class="big">+' + L.mine.pts + '</div></div></div>';
    h += '<ul class="notes">';
    L.notes.forEach(function (n) { h += '<li class="' + (n.c || '') + '">' + esc(n.t) + '</li>'; });
    h += '</ul><div class="scroll"><table><thead><tr><th>#</th><th>Driver</th><th class="num">Pts</th></tr></thead><tbody>';
    L.order.forEach(function (o) {
      h += '<tr class="' + (o.me ? 'me' : '') + '"><td class="num ' + (o.dnf ? 'dnf' : '') + '">' + (o.dnf ? 'DNF' : o.pos) + '</td><td>' + esc(o.name) + '<div class="team">' + esc(o.team) + '</div></td><td class="num">' + (o.pts ? '+' + o.pts : '0') + '</td></tr>';
    });
    h += '</tbody></table></div><div style="margin-top:16px"><button class="btn" data-go="' + (s.result ? 'season' : 'next') + '">' + (s.result ? 'Season review' : 'Next race weekend') + '</button></div></div>';
    return h;
  }

  function seasonView() {
    var r = s.result, t = tier(), h = '<div class="card">';
    if (r.champion && s.tier === TIERS.length - 1) {
      h += '<div class="banner"><h2>World Champion</h2><p>You won the ' + esc(t.name) + ' title. The journey from the karting track is complete.</p></div>';
    } else if (r.champion) {
      h += '<div class="banner"><h2>' + esc(t.name) + ' champion</h2><p>You won the title in season ' + s.season + '.</p></div>';
    } else {
      h += '<h2 style="margin-bottom:10px">Season ' + s.season + ' review</h2>';
    }
    h += '<div class="row" style="justify-content:flex-start;gap:24px;margin-bottom:12px"><div><div class="label">Final position</div><div class="big">' + ord(r.pos) + '</div></div><div><div class="label">Season bonus</div><div class="big">' + money(r.bonus) + '</div></div></div>';
    if (r.promote) {
      h += '<p>Top three finish: you are offered a seat in <b>' + esc(t.next) + '</b>. Rivals there are stronger, so expect a tougher fight.</p>';
      h += '<div class="row" style="justify-content:flex-start"><button class="btn" data-go="promote">Step up to ' + esc(t.next) + '</button><button class="btn secondary" data-go="stay">Stay in ' + esc(t.name) + '</button></div>';
    } else if (s.tier === TIERS.length - 1) {
      h += '<p>Keep racing to defend your place at the top.</p><button class="btn" data-go="stay">Start season ' + (s.season + 1) + '</button>';
    } else {
      h += '<p>Finish in the top three to get an offer from ' + esc(t.next) + '. Train hard and try again.</p><button class="btn" data-go="stay">Start season ' + (s.season + 1) + '</button>';
    }
    h += '<p class="mute" style="margin-top:12px;font-size:.9rem">A new season gives +2 to every skill and fully restores your energy.</p></div>';
    return h;
  }

  function driveView() {
    var tr = s.calendar[s.race];
    return '<div class="card"><div class="weekend"><h2>' + esc(tr.name) + '</h2><span class="chip">' + (s.pending.wet ? 'Wet: less grip' : 'Dry') + '</span><span class="chip">' + LAPS + ' laps</span></div>' +
      '<div class="stage" id="stage"><div class="hud mono"><span id="hud-lap">Lap 1/' + LAPS + '</span><span id="hud-pos">P?</span><span id="hud-spd">0 km/h</span><span id="hud-time">0:00.0</span><span id="hud-off" class="bad"></span><span id="hud-pad" class="mute"></span><button class="btn ghost" data-go="fs" id="fsbtn" style="margin-left:auto">Full screen (F)</button><button class="btn ghost" data-go="snd" id="sndbtn">' + (Snd.mute ? 'Sound: Off (M)' : 'Sound: On (M)') + '</button><button class="btn ghost" data-go="pad">Gamepad setup</button></div>' +
      '<div class="canvaswrap"><canvas id="cv"></canvas><div class="driveover" id="driveover" hidden></div></div>' +
      '<div class="touch"><button data-key="left" aria-label="Steer left">&#9664;</button><button data-key="right" aria-label="Steer right">&#9654;</button><button data-key="down" aria-label="Brake">Brake</button><button data-key="up" aria-label="Gas">Gas</button></div></div>' +
      '<p class="mute" style="margin-top:10px;font-size:.9rem">Keys: arrows or W A S D. Gamepad: left stick steers, right trigger gas, left trigger brake. Brake before corners, stay on the asphalt. Cars do not collide. Your skills and car set how fast you can go.</p>' +
      '<button class="btn ghost" data-go="driveSkip">Simulate this race instead</button></div>';
  }

  function offersView() {
    var t = tier();
    var h = '<div class="card"><h2 style="margin-bottom:6px">Season ' + s.season + ' team offers</h2><p class="mute">Pick your ' + esc(t.name) + ' team. A faster car helps every race. Better teams ask for more reputation (you have ' + Math.round(s.rep) + ').</p><div class="opts" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">';
    s.offers.forEach(function (o, i) {
      var ok = s.rep >= o.req;
      h += '<div class="opt"><button class="offer" data-go="team" data-i="' + i + '"' + (ok ? '' : ' disabled') + '><span class="label">' + esc(o.kind) + '</span><span class="t">' + esc(o.name) + '</span>' +
        '<span class="d">Car rating ' + o.car + '</span><span class="d">' + (o.bonus ? 'Signing bonus ' + money(o.bonus) : 'No signing bonus') + '</span>' +
        '<span class="d">' + (ok ? 'Available' : 'Needs reputation ' + o.req) + '</span></button></div>';
    });
    return h + '</div></div>';
  }

  function startView() {
    return '<div class="card start"><h2 style="margin-bottom:10px">Start your career</h2><p>You begin in junior karting with a small budget. Win races, build your reputation and climb through senior karting, then Formula 4, 3 and 2 to Formula 1.</p>' +
      '<p class="label" style="margin-top:16px">Driver name</p><p><input id="name" type="text" maxlength="20" placeholder="Your name" value="' + esc(ui.name) + '"></p>' +
      '<p class="label">Opponents</p><div class="opts" style="grid-template-columns:repeat(3,minmax(0,1fr))">' + Object.keys(DIFF).map(function (k) { return opt('diff', k, ui.diff === k, DIFF[k].label, DIFF[k].desc, false); }).join('') + '</div>' +
      '<button class="btn" data-go="start">Start career</button></div>';
  }

  function render() {
    var hs = document.getElementById('hstate'), app = document.getElementById('app');
    if (Game.on) Game.stop();
    document.body.style.overflow = '';
    if (document.fullscreenElement && document.exitFullscreen) { try { var fr = document.exitFullscreen(); if (fr && fr.catch) fr.catch(function () {}); } catch (e) {} }
    var padBtn = '<button class="btn ghost" data-go="pad">Gamepad</button>';
    if (!s) { hs.innerHTML = padBtn; app.innerHTML = startView(); return; }
    hs.innerHTML = '<span class="chip tier">' + esc(tier().name) + '</span><span class="chip">Season ' + s.season + '</span><span class="chip">Race ' + Math.min(s.race + (s.phase === 'prep' ? 1 : 0), s.calendar.length) + '/' + s.calendar.length + '</span>' +
      padBtn + '<button class="btn ghost' + (ui.confirmReset ? ' warn' : '') + '" data-go="reset">' + (ui.confirmReset ? 'Confirm: delete career' : 'New career') + '</button>';
    var main = s.phase === 'drive' ? driveView() : s.phase === 'offers' ? offersView() : s.phase === 'prep' ? prepView() : s.phase === 'result' ? resultView() : seasonView();
    app.innerHTML = '<div class="grid"><div class="main">' + main + '</div><div class="side">' + driverCard() + standingsCard() + '</div></div>';
    if (s.phase === 'drive') Game.start(document.getElementById('cv'));
  }

  /* ---------- events ---------- */
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.name === 'action') { ui.action = el.value; render(); var n = document.getElementById('action-' + el.value); if (n) n.focus(); }
    if (el.name === 'diff') { ui.diff = el.value; if (s) { s.diff = el.value; save(); } render(); var dd = document.getElementById('diff-' + el.value); if (dd) dd.focus(); }
    if (el.name === 'mode') { ui.mode = el.value; render(); var q = document.getElementById('mode-' + el.value); if (q) q.focus(); }
    if (el.name === 'strat') { ui.strat = el.value; render(); var m = document.getElementById('strat-' + el.value); if (m) m.focus(); }
  });
  document.addEventListener('input', function (e) { if (e.target.id === 'name') ui.name = e.target.value; });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]');
    if (!b) return;
    var g = b.getAttribute('data-go');
    if (g !== 'reset') ui.confirmReset = false;
    if (g === 'start') { newCareer(ui.name.trim()); save(); }
    else if (g === 'team') {
      var o = s.offers[+b.getAttribute('data-i')];
      if (o && s.rep >= o.req) { s.team = { name: o.name, car: o.car }; s.money += o.bonus; s.drivers[0].team = o.name; setupWeekend(); save(); }
    }
    else if (g === 'race') { if (ui.mode === 'drive') Snd.init(); runWeekend(ui.action, ui.strat); }
    else if (g === 'fs') { toggleFS(); return; }
    else if (g === 'snd') { toggleSnd(); return; }
    else if (g === 'pad') { PadUI.open(); return; }
    else if (g === 'driveDone') { runWeekend(null, null, { order: Game.order || [] }); }
    else if (g === 'driveSkip') { runWeekend(null, ui.strat, { sim: true }); }
    else if (g === 'next') { if (s.race < s.calendar.length) { setupWeekend(); save(); } }
    else if (g === 'season') { s.phase = 'season'; save(); }
    else if (g === 'promote') { s.tier += 1; s.season += 1; startSeason(true); save(); }
    else if (g === 'stay') { s.season += 1; startSeason(true); save(); }
    else if (g === 'reset') {
      if (!ui.confirmReset) { ui.confirmReset = true; if (s && s.phase === 'drive') { b.textContent = 'Confirm: delete career'; b.classList.add('warn'); return; } }
      else { try { localStorage.removeItem(KEY); } catch (err) {} s = null; ui.confirmReset = false; }
    }
    render();
    window.scrollTo(0, 0);
  });

  s = load();
  render();
})();
</script>
